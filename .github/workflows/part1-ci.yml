name: RaceDay CI and Documentation Check

on:
  push:
  pull_request:

jobs:
  validate-part1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder
        run: test -d docs

      - name: Check ERD
        run: test -f docs/RaceDay_ERD.pdf

      - name: Check API Endpoint Plan
        run: test -f docs/RaceDay_API_Endpoint_Plan.pdf

      - name: Check SQL Script
        run: test -f docs/RaceDay_Database.sql

      - name: Check README
        run: test -f README.md

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore PROG6212_POE_Part1.sln

      - name: Build solution
        run: dotnet build PROG6212_POE_Part1.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test PROG6212_POE_Part1.sln --configuration Release --no-build